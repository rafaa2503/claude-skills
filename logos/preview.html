<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherka Logo-Konzepte</title><style>
body{margin:0;padding:24px 16px;background:#1a1a1a;color:#eee;font:15px -apple-system,Inter,sans-serif}
section{max-width:900px;margin:0 auto 40px} h2{font-weight:600;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:16px}
.round{width:140px;height:140px;border-radius:50%;outline:1px solid #333}
.fav{display:flex;gap:12px;align-items:center;background:#2a2a2a;padding:12px;border-radius:8px}
.lock{width:min(420px,100%);border-radius:8px;outline:1px solid #333}
</style></head><body><section><h2>1 · Punkt</h2>
<div class="row">
 <img class="round" src="concepts/concept-1-icon-dark.svg"><img class="round" src="concepts/concept-1-icon-light.svg">
 <div class="fav"><img src="concepts/concept-1-icon-dark.svg" width="32"><img src="concepts/concept-1-icon-dark.svg" width="16"><img src="concepts/concept-1-icon-light.svg" width="32"><img src="concepts/concept-1-icon-light.svg" width="16"></div>
</div>
<div class="row"><img class="lock" src="concepts/concept-1-lockup-dark.svg"><img class="lock" src="concepts/concept-1-lockup-light.svg"></div></section><section><h2>2 · Bogen</h2>
<div class="row">
 <img class="round" src="concepts/concept-2-icon-dark.svg"><img class="round" src="concepts/concept-2-icon-light.svg">
 <div class="fav"><img src="concepts/concept-2-icon-dark.svg" width="32"><img src="concepts/concept-2-icon-dark.svg" width="16"><img src="concepts/concept-2-icon-light.svg" width="32"><img src="concepts/concept-2-icon-light.svg" width="16"></div>
</div>
<div class="row"><img class="lock" src="concepts/concept-2-lockup-dark.svg"><img class="lock" src="concepts/concept-2-lockup-light.svg"></div></section><section><h2>3 · Halbscheiben</h2>
<div class="row">
 <img class="round" src="concepts/concept-3-icon-dark.svg"><img class="round" src="concepts/concept-3-icon-light.svg">
 <div class="fav"><img src="concepts/concept-3-icon-dark.svg" width="32"><img src="concepts/concept-3-icon-dark.svg" width="16"><img src="concepts/concept-3-icon-light.svg" width="32"><img src="concepts/concept-3-icon-light.svg" width="16"></div>
</div>
<div class="row"><img class="lock" src="concepts/concept-3-lockup-dark.svg"><img class="lock" src="concepts/concept-3-lockup-light.svg"></div></section></body></html>

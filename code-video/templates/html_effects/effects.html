{const GAP=26;[[0,1,2],[3,4]].forEach((ids,li)=>{const tot=ids.reduce((a,i)=>a+introW[i].width,0)+GAP*(ids.length-1);let x=540-tot/2;ids.forEach(i=>{introW[i].x=x+introW[i].width/2;x+=introW[i].width+GAP;introW[i].baseY=li?660:540;introW[i].y=introW[i].baseY})})}

  const tx=mkText(n,84);tx.anchor.set(0,.5);tx.position.set(-170,0);c.addChild(dot,tx);c.position.set(540,640+k*210);recap.addChild(c);c.filters=[new F.GlowFilter({distance:20,outerStrength:0,color:OR,quality:.3})];return c});

const {Engine,Bodies,Composite}=Matter;const engine=Engine.create({gravity:{y:1.6}});

  const b=Bodies.rectangle(300+((i*397)%480),-200,w,h,{restitution:.25,friction:.6,chamfer:{radius:30},angle:(i%2?1:-1)*.18});return{c,b,t0,added:false}});
let simT=0;function stepTo(t){while(simT<t-1e-9){for(const c of cards)if(!c.added&&simT>=c.t0){Composite.add(engine.world,c.b);c.added=true}Engine.update(engine,1000/60);simT+=1/60}}
// ---------- Hero ----------
const hero=new PIXI.Container();root.addChild(hero);
const icon=PIXI.Sprite.from('assets/icon-crop.png');icon.anchor.set(.5);icon.scale.set(300/640);icon.position.set(540,620);icon.filters=[new F.GlowFilter({distance:24,outerStrength:2.5,color:OR,quality:.3})];

const c1=mkText('Kostenlos und unverbindlich',44,GR,'500');c1.position.set(540,1495);const c2=mkText('Link in der Bio',44,OR);c2.position.set(540,1565);
const ring=new PIXI.Graphics();const fall=circ(30,OR);
hero.addChild(icon,uA,uB,ctaB,c1,c2,ring,fall);
let ulS=null,ulMask=new PIXI.Graphics();let circS=null,okMarkS=null;
// ---------- p5.brush Assets ----------
window.READY=false;
(async()=>{
  const grab=async(w,h,draw)=>{const c=brush.createCanvas(w,h);brush.clear&&brush.clear();draw();brush.render();const url=c.toDataURL('image/png');const im=new Image();im.src=url;await im.decode();return PIXI.Texture.from(im)};
  brush.seed(11);
  const t1=await grab(520,220,()=>{brush.noFill();brush.set('marker','#ff9f1c',1.7);brush.circle(0,0,90);brush.circle(6,-4,94)});
  brush.seed(5);
  const t2=await grab(420,320,()=>{brush.noFill();brush.set('marker','#ffffff',2.4);brush.line(-110,10,-30,100);brush.line(-30,100,130,-95)});
  brush.seed(9);
  const t3=await grab(760,120,()=>{brush.set('marker','#ff9f1c',2.2);brush.line(-320,5,320,-8);brush.set('2B','#ffcd78',1.2);brush.line(-300,18,300,6)});

  okMarkS=new PIXI.Sprite(t2);okMarkS.anchor.set(.5);okMarkS.scale.set(.5);okG.addChild(okMarkS);
  ulS=new PIXI.Sprite(t3);ulS.anchor.set(.5);ulS.position.set(540,1010);hero.addChild(ulS);ulS.mask=ulMask;hero.addChild(ulMask);
  window.READY=true;window.renderAt(0);
})();
const vis=(o,v)=>{o.visible=v};
window.renderAt=function(t){
  _s=(Math.floor(t*30)*7919+13)>>>0;
  stepTo(t);tl.seek(t*1000);
  const shake=(t>.17&&t<.9)?26*Math.exp(-(t-.17)*9)*Math.sin((t-.17)*70):0;root.position.set(shake,shake*.7);
  // Bulge beim Einschlag
  const bs=(t>.15&&t<.7)?.55*Math.exp(-(t-.17)*7):0;bulge.strength=bs;root.filters=bs>.02?[bulge]:null;
  // Punkt
  let r,x,y,sx=1,sy=1;
  if(t<.17){r=6+(470-6)*Math.pow(t/.17,3);x=540;y=1000}
  else if(t<2.4){const m=sst((t-.45)/.8);r=lerp(470,22,m);x=lerp(540,540,m);y=lerp(1000,938,m);const q=(t-.17)/.3;if(q<1){const k=1+.4*Math.sin(Math.PI*q)*Math.exp(-1.5*q);sx=k;sy=1/k}}
  else{r=22;x=540+210*Math.sin(2*Math.PI*(t-2.4)/3.5)*seg(t,2.4,3.2);y=938+ (t-2.4)*0}
  dotG.visible=t<A[0]+.1&&t<HIT-.6;dotBody.scale.set(r/100*sx,r/100*sy);dotHi.scale.set(r/100*.4*sx,r/100*.28*sy);dotHi.position.set(-r*.28,-r*.34);dotG.position.set(x,y);
  if(t>=2.4){dotG.position.set(540+160*Math.sin(2*Math.PI*(t-2.4)/4),938+(t-2.4)*420);dotG.visible=t<A[0]-.1}
  // Strähnen und Splitter
  strands.forEach((g,i)=>{g.clear();if(t>=.17)return;const ang=(i*2.399)%(2*Math.PI),s0=1500-1350*Math.pow(t/.17,1.5)+(i%5)*40,ln=260+(i%4)*60;g.lineStyle(5,ORL,.9).moveTo(540+Math.cos(ang)*s0,1000+Math.sin(ang)*s0*1.2).lineTo(540+Math.cos(ang)*(s0+ln),1000+Math.sin(ang)*(s0+ln)*1.2)});
  shards.forEach((g,i)=>{const tt=t-.17;if(tt<0||tt>.63){g.visible=false;return}g.visible=true;const ang=(i*2.399+.7)%(2*Math.PI),v=500+(i%6)*100,sz=8+(i%5)*3;g.scale.set(sz);g.alpha=1-tt/.63;g.position.set(540+Math.cos(ang)*v*tt,1000+Math.sin(ang)*v*tt+900*tt*tt)});
  // Hook
  const ha=1-sst((t-1.9)/.25);hook.visible=t<2.2;hookTop.alpha=S.hook1.a*ha;hookTop.y=1230+S.hook1.y;hookBot.alpha=S.hook2.a*ha;hookBot.y=1340+S.hook2.y;
  glitch.offset=t>.4?70*Math.exp(-(t-.45)*2.2):0;glitch.slices=14;glitch.refresh&&glitch.refresh();
  // Intro
  intro.visible=t>2&&t<4;introW.forEach((w,i)=>{const o=S['i'+i];w.alpha=o.a*(1-sst((t-3.6)/.3));w.y=w.baseY+o.y;w.scale.set(o.s)});
  // Titel
  titles.forEach((o,k)=>{const on=t>=A[k]&&t<A[k]+2.4;o.c.visible=on;if(!on)return;const fo=1-sst((t-(A[k]+2.1))/.3);o.c.alpha=S['t'+k].a*fo;o.c.y=300+S['t'+k].y;o.sub.alpha=S['u'+k].a});
  // ST1 Orb
  const on1=t>=A[0]&&t<A[0]+2.7;orbS.visible=orbCap.visible=on1;if(on1){drawOrb(t);const u=eback((t-A[0])/.6,1.4);orbS.scale.set(2.4*clamp(u,.1,1.1));orbCap.alpha=eo((t-A[0]-.8)/.4)*(1-sst((t-(A[0]+2.2))/.4));orbS.alpha=1-sst((t-(A[0]+2.2))/.4)}
  // ST2 Handy
  const on2=t>=A[1]&&t<A[1]+2.7;phone.visible=on2;if(on2){const tau=t-A[1],u=eback(tau/.55,1.5);phone.position.set(540,880);phone.scale.set(clamp(.15+.85*u,.05,1.08));phone.alpha=clamp(tau/.2)*(1-sst((t-(A[1]+2.3))/.4));
    const p=sst((tau-.5)/1.3);phB.c.alpha=p;phA.c.alpha=1-p*.8;pin.alpha=tau>1.5?eo((tau-1.5)/.3):0;pin.scale.set(clamp(eback((tau-1.5)/.35),0,1.1));pinTx.text=tau>2.1?'✓ Erledigt':'Button grösser?';
    if(circS){circS.alpha=tau>1.0?1:0;const m=sst((tau-1.0)/.5);circS.scale.set(.6*(.8+.2*m));circS.alpha=tau>1.0?m:0}}
  // ST3 Freigabe
  const on3=t>=A[2]&&t<A[2]+2.7;appr.visible=on3;if(on3){const tau=t-A[2],u=eback(tau/.55,1.5);appr.scale.set(clamp(.15+.85*u,.05,1.08));appr.alpha=clamp(tau/.2)*(1-sst((t-(A[2]+2.3))/.4));
    const before=tau<1.1;[apT,apS,prev,btn].forEach(o=>o.visible=before);[okG,okT,okS].forEach(o=>o.visible=!before);
    btn.y=150+10*sst((tau-.85)/.1);okG.scale.set(clamp(eback((tau-1.1)/.4),0,1.12));okT.alpha=eo((tau-1.3)/.3);okS.alpha=eo((tau-1.5)/.3);
    if(okMarkS)okMarkS.alpha=1;glow.outerStrength=3+1.5*Math.sin(tau*6)}
  // ST4 Laptop
  const on4=t>=A[3]&&t<A[3]+2.8;lap.visible=on4;if(on4){const tau=t-A[3],u=eback(tau/.55,1.5);lap.scale.set(clamp(.15+.85*u,.05,1.08));lap.alpha=clamp(tau/.2)*(1-sst((t-(A[3]+2.4))/.4));
    const p=sst((tau-.4)/1.2);lapB.alpha=p;lapA.alpha=1-p;pill.alpha=tau>.6?1:0;pill.scale.set(clamp(eback((tau-.6)/.35),0,1.15));chip.alpha=eo((tau-1.2)/.3);lapRef.alpha=eo((tau-1.2)/.3)}
  // Rückblick
  {const on=t>=16.1&&t<18.9;recap.visible=on;if(on){const fo=1-sst((t-18.4)/.4);recap.alpha=fo;recapLine.clear();const prog=clamp((t-16.4)/1.7);recapLine.lineStyle(14,OR,1).moveTo(290,640).lineTo(290,640+630*sst(prog));recapLine.lineStyle(5,0xffe8b4,1).moveTo(290,640).lineTo(290,640+630*sst(prog));
    recapItems.forEach((c,k)=>{const a=eo((t-(16.3+k*.45))/.35);c.alpha=a;c.scale.set(.9+.1*a);c.children[1].alpha=1;c.filters[0].outerStrength=3*a*(1-sst((t-(16.5+k*.45+.6))/.4))})}}
  // Wortkarten
  const wf=1-sst((t-(HIT-.4))/.3);cards.forEach(c=>{c.c.visible=c.added&&wf>0;c.c.alpha=wf;c.c.position.set(c.b.position.x,c.b.position.y);c.c.rotation=c.b.angle});
  // Hero
  const tau=t-HIT;hero.visible=t>HIT-.5;
  fall.visible=t>HIT-.45&&t<HIT;if(fall.visible){const q=(t-(HIT-.45))/.45;fall.position.set(631,lerp(-80,739,q*q));fall.scale.set(1-.25*q,1+.5*q)}
  icon.visible=tau>=0;{const q=tau<0?0:eback(tau/.4);const sq=tau>0&&tau<.3?1+.12*Math.sin(Math.PI*tau/.3):1;icon.scale.set(300/640*clamp(q,0,1.08)*sq)}
  ring.clear();if(tau>0&&tau<.6){const rr_=40+520*eo(tau/.6);ring.lineStyle(5,ORL,(1-tau/.6)*.8).drawEllipse(540,700,rr_,rr_*.35)}
  const up=seg(t,HIT+.1,HIT+.6);uA.alpha=uB.alpha=up>0?1:0;{const wA=uA.width,wB=uB.width;uA.x=540-(wA+wB)/2+wA/2;uB.x=uA.x+wA/2+wB/2;uA.y=uB.y=930}

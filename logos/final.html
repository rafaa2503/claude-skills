<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherka Logo Final</title><style>
body{margin:0;padding:24px 16px;background:#1a1a1a;color:#eee;font:15px -apple-system,sans-serif}
section{max-width:900px;margin:0 auto 32px}h2{font-size:17px;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:16px}
.round{width:140px;height:140px;border-radius:50%;outline:1px solid #333}
.fav{display:flex;gap:12px;align-items:center;background:#2a2a2a;padding:12px;border-radius:8px}
.lock{width:min(420px,100%);border-radius:8px;outline:1px solid #333}
</style></head><body>
<section><h2>Kombination · Halbscheiben + Punkt</h2>
<div class="row"><img class="round" src="final/icon-dark.svg"><img class="round" src="final/icon-light.svg">
<div class="fav"><img src="final/icon-dark.svg" width="32"><img src="final/icon-dark.svg" width="16"><img src="final/icon-light.svg" width="32"><img src="final/icon-light.svg" width="16"></div></div>
<div class="row"><img class="lock" src="final/lockup-dark.svg"><img class="lock" src="final/lockup-light.svg"></div>
<div class="row"><img class="lock" src="final/wordmark-dark.svg"><img class="lock" src="final/wordmark-light.svg"></div></section>
</body></html>
